<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Karim MicroVM OS — architecture, subsystem internals, post-mortems and CLI reference." />
    <link rel="icon" type="image/svg+xml" href="/src/brand/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <title>Karim MicroVM OS Documentation</title>
    <script>
      // Apply the stored theme before first paint (dark by default).
      try {
        if (localStorage.getItem('karim-theme') === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body class="bg-white text-slate-700 antialiased dark:bg-slate-950 dark:text-slate-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
