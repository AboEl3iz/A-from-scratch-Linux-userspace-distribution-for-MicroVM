<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="karim-logo-title">
  <title id="karim-logo-title">Karim MicroVM OS</title>
  <defs>
    <linearGradient id="karim-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Hypervisor boundary: four corner brackets -->
  <g fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 18V10a4 4 0 0 1 4-4h8"/>
    <path d="M46 6h8a4 4 0 0 1 4 4v8"/>
    <path d="M58 46v8a4 4 0 0 1-4 4h-8"/>
    <path d="M18 58h-8a4 4 0 0 1-4-4v-8"/>
  </g>
  <!-- Guest (MicroVM) frame -->
  <rect x="15" y="15" width="34" height="34" rx="8" fill="none" stroke="#14b8a6" stroke-width="3"/>
  <!-- Control-plane channels from the frame to the core -->
  <g stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round">
    <path d="M32 15v6"/><path d="M49 32h-6"/><path d="M32 49v-6"/><path d="M15 32h6"/>
  </g>
  <!-- Kernel core -->
  <rect x="25" y="25" width="14" height="14" rx="3" transform="rotate(45 32 32)" fill="url(#karim-core)"/>
  <circle cx="32" cy="32" r="2.5" fill="#020617"/>
</svg>
