name: "Deploy Documentation to GitHub Pages"

on:
  push:
    branches: [main, master]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Mermaid diagrams
        run: npm run check:diagrams

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # Project pages are served from /<repository>/; user/org pages and
          # custom domains from "/". configure-pages reports the right base.
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
